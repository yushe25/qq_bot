<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QQF 控制台</title>
<style>
  :root {
    --bg: #f4f5f2;
    --panel: #ffffff;
    --ink: #1f2421;
    --muted: #6b716c;
    --line: #d8dcd6;
    --teal: #127a6a;
    --teal-soft: #e0f2ed;
    --amber: #b26a16;
    --amber-soft: #fbeedc;
    --red: #b8332a;
    --red-soft: #fbe5e2;
    --blue-soft: #e4eef4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.5 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    letter-spacing: 0;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 22px;
    background: var(--ink);
    color: #fff;
  }
  .brand { font-weight: 700; font-size: 18px; }
  .status { display: flex; align-items: center; gap: 8px; color: #d7dcd8; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #8a918c; }
  .dot.on { background: #45d6a9; box-shadow: 0 0 8px #45d6a9; }
  main { max-width: 1440px; margin: 0 auto; padding: 18px 22px 40px; display: grid; gap: 18px; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .stat {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px 14px;
  }
  .stat b { display: block; font-size: 26px; line-height: 1.2; }
  .stat span { color: var(--muted); font-size: 12px; }
  .layout { display: grid; grid-template-columns: minmax(320px, 1fr) minmax(280px, 0.8fr); gap: 18px; align-items: start; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
  }
  .panel h2 { margin: 0; padding: 10px 14px; font-size: 14px; border-bottom: 1px solid var(--line); }
  .controls {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
  }
  .controls label { color: var(--muted); font-size: 12px; }
  .controls select {
    min-width: 180px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    border-radius: 5px;
    padding: 5px 8px;
    font: inherit;
  }
  .session {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
  }
  .session:last-child { border-bottom: 0; }
  .session .meta { display: grid; gap: 4px; min-width: 0; }
  .session .id { font-weight: 700; overflow-wrap: anywhere; }
  .session .sub { color: var(--muted); font-size: 12px; }
  .actions { display: flex; gap: 6px; align-items: start; }
  button {
    border: 1px solid var(--ink);
    background: #fff;
    color: var(--ink);
    border-radius: 5px;
    padding: 5px 9px;
    font-size: 12px;
    cursor: pointer;
  }
  button:hover { background: #f0f3ee; }
  button.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .badge {
    display: inline-block;
    border-radius: 999px;
    padding: 2px 8px;
    font-size: 11px;
    background: var(--blue-soft);
  }
  .badge.active, .badge.waking { background: var(--teal-soft); color: var(--teal); }
  .badge.diving { background: var(--amber-soft); color: var(--amber); }
  .badge.paused { background: var(--red-soft); color: var(--red); }
  .feed { min-height: 260px; max-height: 520px; overflow-y: auto; }
  .feed ul { list-style: none; margin: 0; padding: 6px 0; }
  .feed li {
    display: grid;
    grid-template-columns: 96px 1fr;
    gap: 10px;
    padding: 6px 14px;
    border-bottom: 1px solid #eef0ec;
    font-size: 12px;
  }
  .feed .t { color: var(--muted); }
  .feed .msg { min-width: 0; overflow-wrap: anywhere; }
  .feed .event-title { display: block; margin-bottom: 2px; }
  .feed .detail { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #e8ebe6; vertical-align: top; }
  th { background: #f1f3ef; font-weight: 600; white-space: nowrap; }
  td.detail { min-width: 260px; overflow-wrap: anywhere; }
  .empty { padding: 16px 14px; color: var(--muted); }
  @media (max-width: 900px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .layout { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">QQF</div>
  <div class="status"><span id="state-dot" class="dot"></span><span id="state-text">离线</span><button id="token-button" type="button">Token</button></div>
</header>
<main>
  <section class="stats">
    <div class="stat"><span>会话</span><b id="stat-sessions">0</b></div>
    <div class="stat"><span>活跃中</span><b id="stat-active">0</b></div>
    <div class="stat"><span>运行时长</span><b id="stat-uptime">0s</b></div>
    <div class="stat"><span>版本</span><b id="stat-version">-</b></div>
  </section>
  <section class="layout">
    <div class="panel">
      <h2>会话</h2>
      <div id="sessions"><div class="empty">加载中</div></div>
    </div>
    <div class="panel">
      <h2>实时</h2>
      <div class="feed"><ul id="feed"></ul></div>
    </div>
  </section>
  <section class="panel">
    <h2>唤醒日志</h2>
    <div class="controls">
      <label for="wake-session">会话</label>
      <select id="wake-session"><option value="">全部会话</option></select>
      <button id="wake-refresh" type="button">刷新</button>
    </div>
    <div style="overflow-x:auto">
      <table>
        <thead><tr><th>时间</th><th>会话</th><th>类别</th><th>判定</th><th>原因</th><th>概率</th><th>下次</th><th>Token</th></tr></thead>
        <tbody id="wake-logs"></tbody>
      </table>
    </div>
  </section>
  <section class="panel">
    <h2>审计</h2>
    <div style="overflow-x:auto">
      <table>
        <thead><tr><th>时间</th><th>来源</th><th>动作</th><th>会话</th><th>详情</th><th>结果</th></tr></thead>
        <tbody id="audit"></tbody>
      </table>
    </div>
  </section>
</main>
<script>
const $ = (sel) => document.querySelector(sel);
let ws = null;
let token = sessionStorage.getItem('qqfToken') || '';

function setOnline(on) {
  $('#state-dot').classList.toggle('on', on);
  $('#state-text').textContent = on ? '在线' : '离线';
}

function fmt(ms) {
  if (!ms) return '-';
  const date = new Date(ms * 1000);
  return date.toLocaleString();
}

function fmtMs(ms) {
  return fmt(Number(ms || 0) / 1000);
}

function option(value, text) {
  const item = document.createElement('option');
  item.value = value;
  item.textContent = text;
  return item;
}

function syncSessionFilter(sessions) {
  const select = $('#wake-session');
  const selected = select.value;
  select.replaceChildren(option('', '全部会话'));
  for (const session of sessions) {
    select.appendChild(option(session.id, session.id));
  }
  if (sessions.some((session) => session.id === selected)) {
    select.value = selected;
  } else {
    select.value = '';
  }
}

function badge(session) {
  const span = document.createElement('span');
  span.className = 'badge';
  if (['active', 'waking', 'diving', 'paused'].includes(session.state)) {
    span.classList.add(session.state);
  }
  span.textContent = session.state;
  return span;
}

function askToken() {
  const entered = window.prompt('请输入控制台 Token');
  if (!entered || !entered.trim()) return false;
  token = entered.trim();
  sessionStorage.setItem('qqfToken', token);
  return true;
}

async function api(path, options = {}, retry = true) {
  const headers = { 'content-type': 'application/json' };
  if (token) headers.authorization = `Bearer ${token}`;
  options.headers = { ...headers, ...(options.headers || {}) };
  const res = await fetch(path, {
    ...options,
  });
  if (res.status === 401 && retry && askToken()) {
    return api(path, options, false);
  }
  if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
  return res.json();
}

async function refresh() {
  await Promise.all([loadHealth(), loadSessions(), loadWakeLogs(), loadAudit()]);
}

async function loadHealth() {
  try {
    const data = await api('/api/health');
    $('#stat-sessions').textContent = data.sessionCount;
    $('#stat-active').textContent = data.activeSessions;
    $('#stat-uptime').textContent = data.uptimeSeconds + 's';
    $('#stat-version').textContent = data.version;
  } catch (err) {
    $('#stat-version').textContent = 'err';
  }
}

async function loadSessions() {
  const data = await api('/api/sessions');
  syncSessionFilter(data.sessions);
  const box = $('#sessions');
  box.replaceChildren();
  if (!data.sessions.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = '暂无会话';
    box.appendChild(empty);
    return;
  }
  for (const s of data.sessions) {
    const wrapper = document.createElement('div');
    wrapper.className = 'session';

    const meta = document.createElement('div');
    meta.className = 'meta';
    const idEl = document.createElement('div');
    idEl.className = 'id';
    idEl.textContent = s.id;
    const next = document.createElement('div');
    next.className = 'sub';
    next.append(
      badge(s),
      document.createTextNode(` 唤醒 ${s.wake_count} 次 · 下次 ${fmt(s.next_wake_at / 1000)}`),
    );
    const last = document.createElement('div');
    last.className = 'sub';
    last.textContent = `最后消息 ${fmt(s.last_message_at / 1000)} · 冷却至 ${fmt(s.cooldown_until / 1000)}`;
    meta.append(idEl, next, last);

    const actions = document.createElement('div');
    actions.className = 'actions';
    const buttons = [
      { action: 'wake', label: '唤醒', primary: true },
      { action: 'pause', label: '暂停' },
      { action: 'resume', label: '恢复' },
      { action: 'reset', label: '清空记忆' },
    ];
    for (const item of buttons) {
      const button = document.createElement('button');
      button.textContent = item.label;
      button.dataset.action = item.action;
      button.dataset.id = s.id;
      if (item.primary) button.classList.add('primary');
      actions.appendChild(button);
    }

    wrapper.append(meta, actions);
    box.appendChild(wrapper);
  }
}

async function loadWakeLogs() {
  const sessionId = $('#wake-session').value;
  const query = new URLSearchParams({ limit: '100' });
  if (sessionId) query.set('session_id', sessionId);
  const data = await api(`/api/wake-logs?${query}`);
  const rows = $('#wake-logs');
  rows.replaceChildren();
  if (!data.items.length) {
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.colSpan = 8;
    td.className = 'empty';
    td.textContent = '暂无唤醒日志';
    tr.appendChild(td);
    rows.appendChild(tr);
    return;
  }
  for (const item of data.items) {
    const tr = document.createElement('tr');
    const probability = item.probability == null ? '-' : Number(item.probability).toFixed(2);
    const tokens = item.total_tokens ? `${item.prompt_tokens || 0}/${item.completion_tokens || 0}/${item.total_tokens}` : '-';
    const values = [
      fmtMs(item.ts),
      item.session_id || '-',
      item.category || '-',
      item.decided || '-',
      item.reason || '-',
      probability,
      fmtMs(item.next_wake_at),
      tokens,
    ];
    for (const value of values) {
      const td = document.createElement('td');
      td.textContent = value;
      tr.appendChild(td);
    }
    rows.appendChild(tr);
  }
}

async function loadAudit() {
  const data = await api('/api/audit?limit=100');
  const rows = $('#audit');
  rows.replaceChildren();
  if (!data.items.length) {
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.colSpan = 6;
    td.className = 'empty';
    td.textContent = '暂无审计记录';
    tr.appendChild(td);
    rows.appendChild(tr);
    return;
  }
  for (const item of data.items) {
    const tr = document.createElement('tr');
    const values = [
      fmt(item.ts),
      item.actor_type || '-',
      item.action || '-',
      item.session_id || '-',
    ];
    for (const value of values) {
      const td = document.createElement('td');
      td.textContent = value;
      tr.appendChild(td);
    }
    const detail = document.createElement('td');
    detail.className = 'detail';
    detail.textContent = item.detail || '';
    const result = document.createElement('td');
    result.textContent = item.result || '-';
    tr.append(detail, result);
    rows.appendChild(tr);
  }
}

const eventLabels = {
  'wake-log': '唤醒判定',
  wake: '开始唤醒',
  'agent-step': '工具调用',
  'agent-error': '模型错误',
  outgoing: '出站消息',
  'session-updated': '会话状态',
  'incoming-skipped': '入站跳过',
  'learning-updated': '学习数据更新',
  'learning-note-rejected': '学习笔记拒绝',
};

function feedFields(event) {
  return Object.entries(event)
    .filter(([key, value]) => key !== 'type' && ['string', 'number', 'boolean'].includes(typeof value))
    .map(([key, value]) => `${key}: ${value}`)
    .join(' · ');
}

function renderFeed(event) {
  const feed = $('#feed');
  if (feed.children.length > 80) feed.replaceChildren();
  const li = document.createElement('li');
  const time = document.createElement('span');
  time.className = 't';
  time.textContent = event.type;
  const msg = document.createElement('div');
  msg.className = 'msg';
  const title = document.createElement('strong');
  title.className = 'event-title';
  title.textContent = eventLabels[event.type] || event.type;
  const summary = document.createElement('span');
  const detail = document.createElement('span');
  detail.className = 'detail';

  if (event.type === 'wake-log') {
    summary.textContent = `${event.reason || '-'} · ${event.decided || '-'}`;
    detail.textContent = [
      event.session_id,
      event.category,
      event.next_wake_at ? `下次 ${fmtMs(event.next_wake_at)}` : '',
    ].filter(Boolean).join(' · ');
  } else if (event.type === 'wake') {
    summary.textContent = event.reason || '-';
    detail.textContent = [event.session_id, event.category].filter(Boolean).join(' · ');
  } else if (event.type === 'agent-step') {
    summary.textContent = `${event.tool || '-'} · ${event.ok ? '成功' : '失败'}`;
    detail.textContent = [`第 ${event.step || '-'} 步`, event.message].filter(Boolean).join(' · ');
  } else if (event.type === 'agent-error') {
    summary.textContent = event.error || '-';
    detail.textContent = [event.session_id, `第 ${event.step || '-'} 步`].filter(Boolean).join(' · ');
  } else if (event.type === 'outgoing') {
    summary.textContent = event.text || '-';
    detail.textContent = [event.session_id, event.scene_id].filter(Boolean).join(' · ');
  } else if (event.type === 'session-updated' && event.session) {
    summary.textContent = `${event.session.id} · ${event.session.state}`;
    detail.textContent = `唤醒 ${event.session.wake_count} 次`;
  } else if (event.type === 'incoming-skipped') {
    summary.textContent = event.reason || '-';
    detail.textContent = [event.session_id, event.text].filter(Boolean).join(' · ');
  } else {
    summary.textContent = feedFields(event) || '-';
  }

  msg.append(title, summary);
  if (detail.textContent) msg.appendChild(detail);
  li.append(time, msg);
  feed.prepend(li);
}

document.addEventListener('click', async (ev) => {
  const button = ev.target.closest('button[data-action]');
  if (!button) return;
  const { id, action } = button.dataset;
  button.disabled = true;
  try {
    const path = `/api/sessions/${encodeURIComponent(id)}/${action}`;
    if (action === 'wake') {
      await api(path, { method: 'POST', body: JSON.stringify({ reason: '控制台强制唤醒' }) });
    } else {
      await api(path, { method: 'POST', body: JSON.stringify({}) });
    }
    refresh();
  } finally {
    button.disabled = false;
  }
});

async function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  let auth = '';
  if (token) {
    try {
      const data = await api('/api/ws-ticket', { method: 'POST', body: '{}' });
      auth = `?ticket=${encodeURIComponent(data.ticket)}`;
    } catch (err) {
      setOnline(false);
      setTimeout(connect, 3000);
      return;
    }
  }
  const target = new WebSocket(`${proto}://${location.host}/ws/live${auth}`);
  target.onopen = () => setOnline(true);
  target.onclose = () => { setOnline(false); setTimeout(connect, 3000); };
  target.onmessage = (message) => {
    const event = JSON.parse(message.data);
    if (event.type !== 'ping') renderFeed(event);
    if (event.type === 'session-updated') loadSessions();
    if (event.type === 'wake-log') loadWakeLogs();
  };
  ws = target;
}

$('#wake-session').addEventListener('change', loadWakeLogs);
$('#wake-refresh').addEventListener('click', loadWakeLogs);
$('#token-button').addEventListener('click', () => {
  if (!askToken()) return;
  if (ws) ws.close();
  refresh();
  connect();
});
refresh();
connect();
setInterval(loadHealth, 10000);
</script>
</body>
</html>
